<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>lost in the clouds · nubuza</title>
  <!--
    The 404 of both nubuza.com and apps.nubuza.com (apps-root/public/404.html is a symlink to
    this file), so every URL here is absolute to nubuza.com. Keep the app list and its
    descriptions in step with the gallery in index.html.
  -->
  <link rel="icon" href="https://nubuza.com/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://nubuza.com/styles.css">
  <style>
    .lost h1 { margin-bottom: 0; }
    .lost .path { font-size: .9rem; color: var(--ink-soft); word-break: break-all; }
    .lost .path code { background: var(--paper); padding: 2px 8px; border-radius: 8px; }
    .lost .guess { font-size: 1.15rem; }
    .lost .home {
      display: inline-block; margin: 8px 0 28px; padding: 10px 22px; border-radius: 999px;
      background: var(--accent); color: #fff; font-weight: 600; text-decoration: none;
      box-shadow: 0 6px 16px var(--shadow);
    }
    .lost .home:hover, .lost .home:focus-visible { transform: translateY(-2px) rotate(-2deg); }
    .lost ul {
      list-style: none; padding: 0; margin: 12px auto 0; max-width: 640px;
      display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
    }
    .lost li a {
      display: block; padding: 6px 14px; border-radius: 999px; background: var(--paper);
      color: var(--ink); text-decoration: none; box-shadow: 0 4px 12px var(--shadow);
    }
    .lost li a:hover, .lost li a:focus-visible { color: var(--accent); }
    .lost #pick { max-width: 640px; margin: 24px auto 0; }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>
  <header class="hero lost">
    <img class="mascot" src="https://nubuza.com/mascot.svg" alt="" width="232" height="256">
    <h1>404</h1>
    <p class="tagline">this page drifted away with the clouds…</p>
    <p class="path" id="path" hidden></p>
    <p class="guess" id="guess" hidden></p>
    <a class="home" href="https://nubuza.com/">float back home</a>
    <p>or hop onto one of our little projects:</p>
    <ul id="apps">
      <li><a href="https://bizarre.lovepolygon.com/" data-about="Pin where and when you fell for someone and watch your love polygon grow on a cute pink map.">Bizarre Love Polygon</a></li>
      <li><a href="https://apps.nubuza.com/money/fivedollars/" data-about="A private ledger for your household: import your bank statements and see every month whether you saved.">5dollars</a></li>
      <li><a href="https://apps.nubuza.com/a-thousand-surnames/" data-about="Import your family tree and get every surname you carry, in order, with how rare each one is in Spain.">A Thousand Surnames</a></li>
      <li><a href="https://apps.nubuza.com/calview/" data-about="Print a blank calendar grid of any size, on one sheet or as a collage of smaller sheets glued together.">calview</a></li>
      <li><a href="https://apps.nubuza.com/photos/copy-cat/" data-about="Passport and ID photos at home: crop yours to any country&#x27;s official size and print a whole sheet of copies.">Copy cat</a></li>
      <li><a href="https://apps.nubuza.com/a-long-journey/" data-about="Log every trip on a hand-inked globe, then watch it played back as a movie with your song.">A Long Journey</a></li>
      <li><a href="https://apps.nubuza.com/ariadna/" data-about="Turn a photo into a string art portrait made of one thread wound around a ring of nails.">Ariadna</a></li>
      <li><a href="https://apps.nubuza.com/music/release-sonar/" data-about="Tell it what music you have and it tells you when your artists release something new.">Release Sonar</a></li>
      <li><a href="https://apps.nubuza.com/saw-it-coming/" data-about="Cut lists for carpenters and stonemasons: plan every panel, the cut order and the offcuts worth keeping.">Saw It Coming</a></li>
      <li><a href="https://apps.nubuza.com/spinny/" data-about="Can&#x27;t decide? Type your options, spin the wheel and let it pick for you.">Spinny</a></li>
    </ul>
    <p class="guess" id="pick" hidden></p>
  </header>
  <script>
    // Show the missing path, suggest the closest app for a mistyped URL (/calvew/) and recommend
    // a random other one.
    const path = location.pathname
    const p = document.getElementById('path')
    p.textContent = ''
    p.append('nothing lives at ', Object.assign(document.createElement('code'), { textContent: location.host + path }))
    p.hidden = false

    const dist = (a, b) => {
      let row = [...Array(b.length + 1).keys()]
      for (let i = 1; i <= a.length; i++) {
        const next = [i]
        for (let j = 1; j <= b.length; j++)
          next[j] = Math.min(row[j] + 1, next[j - 1] + 1, row[j - 1] + (a[i - 1] !== b[j - 1]))
        row = next
      }
      return row[b.length]
    }
    const wanted = path.toLowerCase().split('/').filter(Boolean)
    let best
    for (const a of document.querySelectorAll('#apps a')) {
      const slug = new URL(a.href).pathname.split('/').filter(Boolean).pop()
      if (!slug) continue
      for (const w of wanted) {
        const d = dist(w, slug)
        if (d <= Math.max(2, slug.length / 3) && (!best || d < best.d)) best = { d, a }
      }
    }
    const link = a => Object.assign(a.cloneNode(true), { style: 'color: var(--accent)' })
    if (best) {
      const g = document.getElementById('guess')
      g.append('were you looking for ', link(best.a), '?')
      g.hidden = false
    }
    const others = [...document.querySelectorAll('#apps a')].filter(a => a !== best?.a)
    const rec = others[Math.floor(Math.random() * others.length)]
    const pick = document.getElementById('pick')
    pick.append('we recommend ', link(rec), document.createElement('br'), rec.dataset.about)
    pick.hidden = false
  </script>
</body>
</html>

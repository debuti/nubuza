<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="1200" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f4ff"/>
      <stop offset="1" stop-color="#dcd6fb"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>

  <!-- the printed calendar, a collage of four sheets -->
  <g transform="rotate(-4 200 150)">
    <rect x="58" y="42" width="284" height="216" rx="6" fill="#4a3a6b" opacity=".12" transform="translate(6 8)"/>
    <rect x="58" y="42" width="284" height="216" rx="6" fill="#fff" stroke="#4a3a6b" stroke-width="3"/>
    <rect x="58" y="42" width="284" height="34" rx="6" fill="#b9b0f2" stroke="#4a3a6b" stroke-width="3"/>
    <g font-family="'Fredoka', 'Trebuchet MS', sans-serif" font-weight="600" font-size="13" fill="#4a3a6b" text-anchor="middle">
      <text x="78" y="64">M</text><text x="119" y="64">T</text><text x="159" y="64">W</text><text x="200" y="64">T</text>
      <text x="241" y="64">F</text><text x="281" y="64">S</text><text x="322" y="64">S</text>
    </g>
    <!-- grid: 7 columns, 5 weeks -->
    <g stroke="#7c6fd6" stroke-width="1.5">
      <path d="M98.6 76v182M139.1 76v182M179.7 76v182M220.3 76v182M260.9 76v182M301.4 76v182"/>
      <path d="M58 112.4h284M58 148.8h284M58 185.2h284M58 221.6h284"/>
    </g>
    <!-- day tags in the top-right corner of a few cells -->
    <g fill="#ede9ff" stroke="#7c6fd6" stroke-width="1">
      <path d="M118 77h20v10h-15l-5-5z"/>
      <path d="M199 113h20v10h-15l-5-5z"/>
      <path d="M321 149h20v10h-15l-5-5z"/>
      <path d="M158 186h20v10h-15l-5-5z"/>
    </g>
    <g font-family="'Fredoka', 'Trebuchet MS', sans-serif" font-size="8" fill="#4a3a6b" text-anchor="middle">
      <text x="130" y="85">1N</text><text x="211" y="121">10</text><text x="333" y="157">20</text><text x="170" y="194">23</text>
    </g>
    <!-- a hand-written plan in one cell -->
    <path d="M226 160c6-5 10 4 16-1s9 3 14-1" fill="none" stroke="#ff8fbd" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="240" cy="172" r="5" fill="#ff8fbd"/>
    <!-- collage seams with the red ticks -->
    <g stroke="#4a3a6b" stroke-width="1.5" stroke-dasharray="5 5" opacity=".45">
      <path d="M200 42v216M58 167h284"/>
    </g>
    <g stroke="#ff5a7a" stroke-width="3" stroke-linecap="round">
      <path d="M200 34v10M200 256v10M50 167h10M340 167h10"/>
    </g>
  </g>

  <!-- happy pencil -->
  <g transform="translate(330 218) rotate(35)">
    <rect x="-13" y="-62" width="26" height="78" rx="4" fill="#ffd966" stroke="#4a3a6b" stroke-width="3"/>
    <rect x="-13" y="-74" width="26" height="14" rx="4" fill="#ff8fbd" stroke="#4a3a6b" stroke-width="3"/>
    <path d="M-13 16 L0 40 L13 16z" fill="#f6dcb4" stroke="#4a3a6b" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-4 33 L0 40 L4 33z" fill="#4a3a6b"/>
    <ellipse cx="-5" cy="-30" rx="3" ry="4" fill="#4a3a6b"/>
    <ellipse cx="5" cy="-30" rx="3" ry="4" fill="#4a3a6b"/>
    <path d="M-5 -20 q5 5 10 0" fill="none" stroke="#4a3a6b" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="-9" cy="-23" rx="3" ry="2" fill="#ff8fbd" opacity=".7"/>
    <ellipse cx="9" cy="-23" rx="3" ry="2" fill="#ff8fbd" opacity=".7"/>
  </g>
</svg>

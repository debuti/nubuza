<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="1200" height="900">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e1a4f"/>
      <stop offset="1" stop-color="#5b3c9e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#cbg)"/>
  <!-- sonar rings going out from Echo -->
  <g fill="none" stroke="#c3aefc" stroke-width="3" stroke-linecap="round">
    <path d="M150 95a90 90 0 0 1 0 110" opacity=".8"/>
    <path d="M175 70a125 125 0 0 1 0 160" opacity=".55"/>
    <path d="M200 45a160 160 0 0 1 0 210" opacity=".3"/>
  </g>
  <!-- new records found -->
  <g transform="translate(300 105) rotate(-10)">
    <circle r="48" fill="#14091f" stroke="#ff8db4" stroke-width="3"/>
    <circle r="36" fill="none" stroke="#3a2a55" stroke-width="2"/>
    <circle r="26" fill="none" stroke="#3a2a55" stroke-width="2"/>
    <circle r="15" fill="#ff7fae"/>
    <circle r="3" fill="#14091f"/>
  </g>
  <g transform="translate(270 208)">
    <rect x="-30" y="-30" width="60" height="60" rx="5" fill="#ffc2d6" stroke="#fff" stroke-width="3"/>
    <circle r="16" fill="#8a6cf0"/>
    <circle r="4" fill="#ffc2d6"/>
  </g>
  <g font-family="'Fredoka', 'Trebuchet MS', sans-serif" font-weight="600" text-anchor="middle">
    <rect x="320" y="160" width="58" height="26" rx="13" fill="#ff7fae"/>
    <text x="349" y="178" font-size="15" fill="#fff">NEW</text>
  </g>
<svg x="30" y="80" width="150" height="150" viewBox="0 0 120 120">
<defs>
<linearGradient id="body" x1="0.2" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#c3aefc"/><stop offset="1" stop-color="#8a6cf0"/></linearGradient>
<linearGradient id="wing" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#a68cf7"/><stop offset="1" stop-color="#6f50dc"/></linearGradient>
<linearGradient id="cup" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc2d6"/><stop offset="1" stop-color="#ff8db4"/></linearGradient>
</defs>
<!-- sound waves -->
<g class="waves" fill="none" stroke="#b49cff" stroke-width="3" stroke-linecap="round">
<path d="M94.1 34.7 A12 12 0 0 1 101.8 43.9"/><path d="M96.5 28.1 A19 19 0 0 1 108.7 42.7"/>
<path d="M25.9 34.7 A12 12 0 0 0 18.2 43.9"/><path d="M23.5 28.1 A19 19 0 0 0 11.3 42.7"/>
</g>
<!-- wings -->
<g stroke="#5a3cc4" stroke-opacity="0.45" stroke-width="2.2" stroke-linejoin="round" fill="url(#wing)">
<path d="M42 62 C32 54 18 50 5 52 C8 59 9 66 8 74 C13 71 18 72 21 78 C24 73 30 73 33 80 C35 74 40 72 46 74 Z"/>
<path d="M78 62 C88 54 102 50 115 52 C112 59 111 66 112 74 C107 71 102 72 99 78 C96 73 90 73 87 80 C85 74 80 72 74 74 Z"/>
</g>
<g stroke="#4a2fb0" stroke-opacity="0.35" stroke-width="1.4" stroke-linecap="round" fill="none">
<path d="M40 63 L9 72"/><path d="M40 64 L21 76"/><path d="M80 63 L111 72"/><path d="M80 64 L99 76"/>
</g>
<!-- ears -->
<g stroke="#5a3cc4" stroke-opacity="0.45" stroke-width="2.2" stroke-linejoin="round" fill="url(#body)">
<path d="M37 52 C34 40 34 28 38 18 C46 24 52 32 55 40 Z"/>
<path d="M83 52 C86 40 86 28 82 18 C74 24 68 32 65 40 Z"/>
</g>
<path d="M40 44 C39 37 39 30 41 25 C45 29 48 33 50 38 Z" fill="#ffb3cc" opacity="0.8"/>
<path d="M80 44 C81 37 81 30 79 25 C75 29 72 33 70 38 Z" fill="#ffb3cc" opacity="0.8"/>
<!-- head/body -->
<ellipse cx="60" cy="68" rx="29" ry="27" fill="url(#body)" stroke="#5a3cc4" stroke-opacity="0.45" stroke-width="2.2"/>
<ellipse cx="50" cy="52" rx="10" ry="5" fill="#fff" opacity="0.22" transform="rotate(-20 50 52)"/>
<!-- headphones band -->
<path d="M31 66 C30 34 90 34 89 66" fill="none" stroke="#3d2a7a" stroke-width="4.5" stroke-linecap="round"/>
<path d="M40 44 C50 37 70 37 80 44" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="1.4" stroke-linecap="round"/>
<!-- cups -->
<rect x="25" y="58" width="12" height="20" rx="6" fill="url(#cup)" stroke="#d6457d" stroke-opacity="0.5" stroke-width="2"/>
<rect x="83" y="58" width="12" height="20" rx="6" fill="url(#cup)" stroke="#d6457d" stroke-opacity="0.5" stroke-width="2"/>
<rect x="28" y="62" width="4" height="12" rx="2" fill="#fff" opacity="0.5"/>
<rect x="88" y="62" width="4" height="12" rx="2" fill="#fff" opacity="0.5"/>
<!-- face -->
<ellipse cx="73" cy="78" rx="6" ry="3.4" fill="#ff7fae" opacity="0.45"/>
<ellipse cx="47" cy="78" rx="6" ry="3.4" fill="#ff7fae" opacity="0.45"/>
<ellipse cx="50" cy="68" rx="4.6" ry="5.4" fill="#2e1a4f"/>
<ellipse cx="70" cy="68" rx="4.6" ry="5.4" fill="#2e1a4f"/>
<circle cx="51.8" cy="65.8" r="1.8" fill="#fff"/>
<circle cx="71.8" cy="65.8" r="1.8" fill="#fff"/>
<path d="M54 77 Q60 83 66 77" fill="none" stroke="#2e1a4f" stroke-width="2.6" stroke-linecap="round"/>
<path d="M57.2 79.3 L58.6 83 L60 79.9 Z" fill="#fff"/>
</svg>
</svg>

      <text x="15" y="20" text-anchor="middle" font-size="12" fill="#4a3a6b">1</text>
      <text x="32" y="20.5" fill="#1f6b48">Etxeberria</text>
    </g>
    <g transform="translate(232 78)">
      <rect width="112" height="30" rx="15" fill="#ffd3cc" stroke="#4a3a6b"/>

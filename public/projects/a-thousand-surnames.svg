      <circle cx="15" cy="15" r="10" fill="#fff" stroke="#4a3a6b" stroke-width="2"/>
      <text x="15" y="20" text-anchor="middle" font-size="12" fill="#4a3a6b">4</text>
      <text x="36" y="20.5" font-size="20" fill="#2e9e6c">_</text>
    </g>
    <g transform="translate(232 192)">

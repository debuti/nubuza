<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="1200" height="900">
  <defs>
    <linearGradient id="obg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#e3ebff"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#obg)"/>
  <!-- the arena: a dark box where the two teams bounce -->
  <rect x="58" y="44" width="250" height="212" rx="22" fill="#3a2e3f" opacity=".1" transform="translate(6 8)"/>
  <rect x="58" y="44" width="250" height="212" rx="22" fill="#0b0f1a"/>
  <!-- motion trails -->
  <g fill="none" stroke-linecap="round" stroke-width="3" opacity=".35">
    <path d="M110 214 Q90 190 96 160" stroke="#ff5a5f"/>
    <path d="M250 96 Q276 112 280 140" stroke="#4d8dff"/>
  </g>
  <!-- blue team: splits on walls, so many small ones -->
  <g fill="#4d8dff">
    <circle cx="250" cy="96" r="22"/>
    <circle cx="282" cy="176" r="11"/>
    <circle cx="232" cy="214" r="13"/>
    <circle cx="276" cy="226" r="8"/>
    <circle cx="206" cy="70" r="9"/>
  </g>
  <!-- red team: eats what it touches, so one big one -->
  <circle cx="134" cy="170" r="52" fill="#ff5a5f"/>
  <!-- kawaii faces -->
  <g fill="#0b0f1a">
    <circle cx="118" cy="164" r="6"/>
    <circle cx="150" cy="164" r="6"/>
    <circle cx="243" cy="93" r="3.2"/>
    <circle cx="257" cy="93" r="3.2"/>
  </g>
  <g fill="#fff">
    <circle cx="120" cy="162" r="2"/>
    <circle cx="152" cy="162" r="2"/>
  </g>
  <path d="M124 182 Q134 192 144 182" fill="none" stroke="#0b0f1a" stroke-width="4" stroke-linecap="round"/>
  <path d="M245 103 Q250 107 255 103" fill="none" stroke="#0b0f1a" stroke-width="2.4" stroke-linecap="round"/>
  <g fill="#ffb3c1" opacity=".8">
    <ellipse cx="108" cy="180" rx="7" ry="4"/>
    <ellipse cx="160" cy="180" rx="7" ry="4"/>
  </g>
  <!-- the bet: a coin stack and a "who wins?" bubble -->
  <g transform="translate(6 196)">
    <ellipse cx="22" cy="56" rx="26" ry="9" fill="#3a2e3f" opacity=".12"/>
    <g stroke="#c98a00" stroke-width="2">
      <ellipse cx="22" cy="44" rx="24" ry="9" fill="#ffc93c"/>
      <ellipse cx="22" cy="32" rx="24" ry="9" fill="#ffc93c"/>
      <ellipse cx="22" cy="20" rx="24" ry="9" fill="#ffd96a"/>
    </g>
    <text x="22" y="25" font-family="Fredoka, sans-serif" font-weight="600" font-size="13" text-anchor="middle" fill="#a86f00">¢</text>
  </g>
  <g transform="translate(284 150)">
    <path d="M6 0h88a12 12 0 0 1 12 12v34a12 12 0 0 1-12 12H40l-16 14 2-14H6a12 12 0 0 1-12-12V12A12 12 0 0 1 6 0z" fill="#fff" stroke="#3a2e3f" stroke-width="2.5"/>
    <text x="44" y="35" font-family="Fredoka, sans-serif" font-weight="600" font-size="17" text-anchor="middle" fill="#3a2e3f">who wins?</text>
  </g>
</svg>

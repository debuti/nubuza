<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4f8"/>
      <stop offset="1" stop-color="#ffd6e5"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#ffa8c8"/>
      <stop offset="1" stop-color="#f0478a"/>
    </linearGradient>
    <g id="pin">
      <path d="M0 0 C-9 -12 -12 -18 -12 -24 A12 12 0 1 1 12 -24 C12 -18 9 -12 0 0Z" fill="#f0478a" stroke="#d42f72" stroke-width="2"/>
      <path d="M0 -20 C-4 -24 -8 -26 -5 -30 C-3 -32 -1 -31 0 -29 C1 -31 3 -32 5 -30 C8 -26 4 -24 0 -20Z" fill="#fff"/>
    </g>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>

  <!-- map: blocks, streets, a river and a park -->
  <path d="M-10 210 C80 180 140 250 230 220 S360 170 410 190" fill="none" stroke="#c9e6ff" stroke-width="22" stroke-linecap="round"/>
  <ellipse cx="320" cy="70" rx="48" ry="30" fill="#d8f3e6"/>
  <g fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round">
    <path d="M0 60 L400 90"/>
    <path d="M0 140 L400 130"/>
    <path d="M90 0 L120 300"/>
    <path d="M230 0 L250 300"/>
    <path d="M330 0 L300 300"/>
  </g>
  <g fill="none" stroke="#ffe3ee" stroke-width="4" stroke-linecap="round">
    <path d="M0 100 L400 110"/>
    <path d="M160 0 L180 300"/>
    <path d="M40 0 L50 300"/>
  </g>

  <!-- the love polygon -->
  <polygon points="70,80 205,52 335,118 268,248 120,236 48,170" fill="#f0478a" fill-opacity=".14" stroke="#f0478a" stroke-width="3" stroke-dasharray="9 7" stroke-linejoin="round"/>
  <use href="#pin" x="70" y="80"/>
  <use href="#pin" x="205" y="52"/>
  <use href="#pin" x="335" y="118"/>
  <use href="#pin" x="268" y="248"/>
  <use href="#pin" x="120" y="236"/>
  <use href="#pin" x="48" y="170"/>

  <!-- polygon mascot -->
  <g transform="translate(140 100) scale(1)">
    <polygon points="60,30 72,14 90,10 106,20 112,40 104,62 84,84 60,104 36,84 16,62 8,40 14,20 30,10 48,14" fill="url(#g)" stroke="#d42f72" stroke-width="2.5" stroke-linejoin="round"/>
    <ellipse cx="33" cy="66" rx="8" ry="4.5" fill="#ff5fa2" opacity=".45"/>
    <ellipse cx="87" cy="66" rx="8" ry="4.5" fill="#ff5fa2" opacity=".45"/>
    <ellipse cx="44" cy="53" rx="6" ry="7.5" fill="#3d1631"/>
    <circle cx="46.2" cy="50" r="2.3" fill="#fff"/>
    <ellipse cx="76" cy="53" rx="6" ry="7.5" fill="#3d1631"/>
    <circle cx="78.2" cy="50" r="2.3" fill="#fff"/>
    <path d="M53 65Q60 73 67 65" stroke="#3d1631" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>

name: Instagram launch kit

# One-off: makes the welcome post, carousel, highlight covers, Reels and X header from the
# live app with a fictional demo user, and sends them to Telegram. Runs only by hand.
on:
  workflow_dispatch:
    inputs:
      project:
        description: Which kit
        type: choice
        options: [nubuza, fivedollars, a-thousand-surnames]
        default: nubuza

permissions:
  contents: read

jobs:
  kit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: social/requirements.txt
      - run: |
          pip install -r social/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Make the kit and send it to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m social.tools.launch_kit --out kit --project "${{ inputs.project }}" --send
